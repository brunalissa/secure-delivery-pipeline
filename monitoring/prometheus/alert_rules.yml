# ═══════════════════════════════════════════════════════════════════════════════
# alert_rules.yml — Prometheus Alerting Rules
# ═══════════════════════════════════════════════════════════════════════════════
#
# Alerting rules are evaluated by Prometheus every `evaluation_interval`.
# When a rule expression is true, Prometheus fires an alert.
# The alert is sent to Alertmanager which handles routing (email, Slack, PagerDuty).
#
# Each rule has:
#   - alert:     Alert name (shown in alerts list)
#   - expr:       PromQL expression (fires when true)
#   - for:        Duration the condition must be true before firing
#   - labels:      Severity, team, etc. (used by Alertmanager for routing)
#   - annotations: Human-readable message (with $labels and $value variables)
# ═══════════════════════════════════════════════════════════════════════════════

groups:

  # ─────────────────────────────────────────────────────────────────────────────
  # Application Health Alerts
  # ─────────────────────────────────────────────────────────────────────────────
  - name: application
    interval: 30s
    rules:

      # App is down — no metrics have been scraped recently
      - alert: AppDown
        expr: up{job="secure-delivery-pipeline"} == 0
        for: 2m
        labels:
          severity: critical
          team: devsecops
        annotations:
          summary: "Application {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been down for more than 2 minutes."

      # High HTTP error rate — more than 5% of requests return 5xx
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="secure-delivery-pipeline",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="secure-delivery-pipeline"}[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High HTTP error rate (>5%)"
          description: "More than 5% of HTTP requests to {{ $labels.instance }} are returning 5xx errors."

      # High response latency — 95th percentile > 1 second
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (
            rate(http_server_requests_seconds_bucket{job="secure-delivery-pipeline"}[5m])
          )) > 1.0
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High response latency (P95 > 1s)"
          description: "95th percentile HTTP response time exceeds 1 second for {{ $labels.instance }}."

  # ─────────────────────────────────────────────────────────────────────────────
  # Infrastructure Alerts (JVM)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: infrastructure
    interval: 30s
    rules:

      # High JVM memory usage — heap usage > 85% of max
      - alert: HighJvmMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"}
          > 0.85
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High JVM heap memory usage (>85%)"
          description: "JVM heap memory on {{ $labels.instance }} is above 85% of maximum."

      # JVM memory critical — heap usage > 95% of max
      - alert: CriticalJvmMemoryUsage
        expr: |
          jvm_memory_used_bytes{area="heap"}
          / jvm_memory_max_bytes{area="heap"}
          > 0.95
        for: 1m
        labels:
          severity: critical
          team: devsecops
        annotations:
          summary: "Critical JVM heap memory usage (>95%)"
          description: "JVM heap memory on {{ $labels.instance }} is above 95% — OOM imminent."

      # High CPU usage on the JVM process
      - alert: HighCpuUsage
        expr: process_cpu_usage > 0.80
        for: 5m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "High JVM CPU usage (>80%)"
          description: "JVM CPU usage on {{ $labels.instance }} is above 80% for 5 minutes."

  # ─────────────────────────────────────────────────────────────────────────────
  # Business Metrics Alerts (Custom)
  # ─────────────────────────────────────────────────────────────────────────────
  - name: business
    interval: 30s
    rules:

      # Too many tasks stuck in PENDING status
      - alert: TooManyPendingTasks
        expr: tasks_by_status_total{status="PENDING"} > 100
        for: 10m
        labels:
          severity: warning
          team: devsecops
        annotations:
          summary: "Too many pending tasks (>100)"
          description: "There are {{ $value }} tasks in PENDING status for more than 10 minutes."