# ═══════════════════════════════════════════════════════════════════════════════
# dashboards.yml — Grafana Dashboard Provisioning
# ═══════════════════════════════════════════════════════════════════════════════
#
# Tells Grafana where to find dashboard JSON files. On startup, Grafana
# auto-imports all dashboards from the specified directory.
#
# Dashboards are JSON files — they can be exported from Grafana UI and
# committed to version control (this is how teams manage dashboards as code).
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: 1

providers:
  - name: "Secure Delivery Pipeline Dashboards"
    orgId: 1
    folder: "Secure Delivery Pipeline"
    type: file
    disableDeletion: false    # Allow deleting provisioned dashboards from UI
    updateIntervalSeconds: 30  # How often to scan for new dashboard files
    allowUiUpdates: true       # Allow editing from the Grafana UI
    options:
      path: /var/lib/grafana/dashboards  # Directory where dashboard JSON files are stored