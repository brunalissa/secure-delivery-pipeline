# ═══════════════════════════════════════════════════════════════════════════════
# terraform.yml — Infrastructure as Code Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
# This workflow validates Terraform configuration and applies infrastructure
# changes. It demonstrates the GitOps pattern for infrastructure management:
#   1. Plan  — Show what Terraform WILL change (visible in PR comments)
#   2. Apply — Execute the changes (only on main branch push)
#
# terraform fmt + validate + tflint ensure code quality.
# Trivy IaC scan ensures no security misconfigurations in the Terraform code.
# ═══════════════════════════════════════════════════════════════════════════════

name: "🏗️ Terraform Infrastructure"

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # Needed for PR comments

env:
  TF_VERSION: '1.7.5'
  AWS_REGION: 'us-east-1'

jobs:

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 1: Terraform Validation (always runs — PR and push)
  # ═════════════════════════════════════════════════════════════════════════
  validate:
    name: "Terraform Validate"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      # ── Setup Terraform CLI ───────────────────────────────────────────────
      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Format Check — verify tf files are properly formatted ──────────────
      - name: "Terraform Format"
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true  # Warn but don't fail (for educational purposes)

      # ── Init — download providers & modules ────────────────────────────────
      - name: "Terraform Init"
        run: terraform init -backend=false  # No remote state for validation

      # ── Validate — type-check the configuration ─────────────────────────────
      - name: "Terraform Validate"
        run: terraform validate -no-color

      # ── tflint — Linter for Terraform (best practices) ──────────────────────
      - name: "tflint"
        uses: reviewdog/action-tflint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          working_directory: terraform
          filter_mode: nofilter
          reporter: github-pr-check
        continue-on-error: true

      # ── Trivy IaC Scan — Security misconfiguration detection ────────────────
      - name: "Trivy IaC Scan (Terraform)"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 2: Terraform Plan (show changes — runs on PRs)
  # ═════════════════════════════════════════════════════════════════════════
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── Configure AWS credentials ──────────────────────────────────────────
      # Uses OIDC (OpenID Connect) — no long-lived AWS secrets needed!
      # This is the modern, secure way to authenticate GitHub Actions to AWS.
      - name: "Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          # OIDC requires the "id-token: write" permission
      # Note: this requires GitHub OIDC provider to be configured in AWS IAM
        continue-on-error: true  # Skip if AWS not configured (educational)

      - name: "Terraform Init"
        run: terraform init
        continue-on-error: true

      # ── Plan — show what will change ───────────────────────────────────────
      - name: "Terraform Plan"
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      # ── Post plan output as a PR comment ────────────────────────────────────
      - name: "Comment Plan on PR"
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan_output.txt', 'utf8');
            const output = `#### Terraform Plan 📐
            \`\`\`diff\n${plan}\n\`\`\`
            `;
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: output
            });
        continue-on-error: true

  # ═════════════════════════════════════════════════════════════════════════
  # JOB 3: Terraform Apply (only on push to main)
  # ═════════════════════════════════════════════════════════════════════════
  apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # Manual approval gate
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: "Configure AWS Credentials (OIDC)"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        continue-on-error: true

      - name: "Terraform Init"
        run: terraform init
        continue-on-error: true

      - name: "Terraform Apply"
        run: terraform apply -auto-approve -no-color
        continue-on-error: true  # Educational: don't fail pipeline if AWS not configured