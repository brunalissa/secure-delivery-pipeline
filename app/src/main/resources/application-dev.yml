# ═══════════════════════════════════════════════════════════════════════════════
# application-dev.yml — Development Profile
# ═══════════════════════════════════════════════════════════════════════════════
#
# Active when: -Dspring.profiles.active=dev
#
# Development assumes PostgreSQL running locally via docker-compose.
# Logs are verbose for debugging. JPA SQL is shown.
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devsecops_db}
    username: ${DB_USERNAME:devsecops_user}
    password: ${DB_PASSWORD:devsecops_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.devsecops.securepipeline: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
