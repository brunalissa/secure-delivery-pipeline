# ═══════════════════════════════════════════════════════════════════════════════
# 07-pdb.yaml — Pod Disruption Budget
# ═══════════════════════════════════════════════════════════════════════════════
#
# A Pod Disruption Budget (PDB) ensures that a minimum number of Pods remain
# available during voluntary disruptions (e.g., node drain for maintenance,
# cluster autoscaling, rolling updates).
#
# WITHOUT a PDB, Kubernetes could evict ALL pods simultaneously during node
# maintenance, causing a service outage. The PDB prevents this.
#
# The PDB does NOT protect against involuntary disruptions (node failure,
# power loss, kernel panic). Those are handled by the Deployment controller's
# self-healing (it creates a new Pod to replace a dead one).
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secure-delivery-pipeline-pdb
  namespace: secure-delivery-pipeline
  labels:
    app.kubernetes.io/name: secure-delivery-pipeline
spec:
  # minAvailable ensures at least this many pods are always running.
  # With 2 replicas and minAvailable=1, at most 1 pod can be disrupted at a time.
  minAvailable: 1

  # Alternatively, use maxUnavailable (mutually exclusive with minAvailable):
  # maxUnavailable: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: secure-delivery-pipeline
---