# ═══════════════════════════════════════════════════════════════════════════════
# 02-secret.yaml — Sensitive Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# A Secret stores sensitive data (passwords, tokens, certificates).
# Secrets are base64-encoded (NOT encrypted) by default. To encrypt:
#   1. Enable encryption at rest in your K8s cluster (EncryptDataAtRest)
#   2. Use an external secrets manager (AWS Secrets Manager, HashiCorp Vault)
#   3. Use External Secrets Operator to sync from external secret stores
#
# WARNING: The values below are base64-encoded PLACEHOLDERS.
# In production, NEVER commit real secrets to Git. Use:
#   - kubectl create secret (CLI)
#   - Sealed Secrets (Bitnami)
#   - External Secrets Operator + Vault/AWS Secrets Manager
#   - SOPS (Mozilla) for encrypted files in Git
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: secure-delivery-pipeline-secrets
  namespace: secure-delivery-pipeline
  labels:
    app.kubernetes.io/name: secure-delivery-pipeline
type: Opaque  # Opaque = arbitrary key-value pairs (default)
data:
  # Base64-encoded database password.
  # To encode: echo -n 'your_password' | base64
  # To decode: echo 'ZGV2c2Vjb3BzX3Bhc3N3b3Jk' | base64 --decode

  # DB_PASSWORD = devsecops_password (base64: ZGV2c2Vjb3BzX3Bhc3N3b3Jk)
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
---
